query OriginalDescription($owner: String!, $repo: String!, $number: Int!) {
  repository(owner: $owner, name: $repo) {
    issue(number: $number) {
      number
      url
      title
      createdAt
      body
      lastEditedAt
      includesCreatedEdit
      userContentEdits(first: 100) {
        totalCount
        pageInfo { hasNextPage }
        nodes { editedAt deletedAt diff }
      }
    }
  }
}
