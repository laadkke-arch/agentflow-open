<svg xmlns="http://www.w3.org/2000/svg" width="160" height="158" viewBox="0 0 160 158">
  <title>Five paired occurrence controls</title>
  <desc>Rows: inherited wash, independent definitions, explicit copy, parameterized definition, explicit paint.</desc>
  <defs>
    <rect id="plain" width="20" height="20"/>
    <rect id="ind-first" width="20" height="20" fill="blue"/>
    <rect id="ind-second" width="20" height="20" fill="blue"/>
    <rect id="copy-source" width="20" height="20" fill="blue"/>
    <rect id="parameter" width="20" height="20" fill="blue"/>
    <rect id="explicit" width="20" height="20" fill="blue"/>
  </defs>
  <use id="isolation-1" href="#plain" x="20" y="8" fill="blue"/>
  <use id="isolation-2" href="#plain" x="90" y="8" fill="blue"/>
  <use id="independent-1" href="#ind-first" x="20" y="38"/>
  <use id="independent-2" href="#ind-second" x="90" y="38"/>
  <use id="copied-1" href="#copy-source" x="20" y="68"/>
  <rect id="copied-2" x="90" y="68" width="20" height="20" fill="blue"/>
  <use id="param-1" href="#parameter" x="20" y="98" style="--ink:red"/>
  <use id="param-2" href="#parameter" x="90" y="98" style="--ink:blue"/>
  <use id="cascade-1" href="#explicit" x="20" y="128" fill="blue"/>
  <use id="cascade-2" href="#explicit" x="90" y="128" fill="blue"/>
</svg>
