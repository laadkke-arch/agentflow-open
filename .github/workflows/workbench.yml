name: Workbench acceptance
on:
  push:
    branches: [chore/workspace-foundation, 'work/**', 'codex/**']
    paths:
      - 'workbench/**'
      - 'lab/**'
      - 'scripts/**'
      - 'docs/procedures/**'
      - '.gitattributes'
      - '.python-version'
      - '.github/workflows/workbench.yml'
  pull_request:
    branches: [main, chore/workspace-foundation]
    paths:
      - 'workbench/**'
      - 'lab/**'
      - 'scripts/**'
      - 'docs/procedures/**'
      - '.gitattributes'
      - '.python-version'
      - '.github/workflows/workbench.yml'
permissions:
  contents: read
concurrency:
  group: workbench-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read exact committed workspace and history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, checked 2026-11-15
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Use Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, checked 2026-11-15
        with:
          python-version: '3.12'
      - name: Check this checkout and preserve success or failure evidence
        run: python scripts/cloud_check.py --environment github-actions --fetch-contract --require-clean
      - name: Keep bounded execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24, checked 2026-11-15
        with:
          name: workbench-evidence-${{ matrix.os }}-${{ github.sha }}
          path: |
            .workbench/cloud-check.json
            .workbench/cloud-check-logs/**
            .workbench/acceptance.json
            .workbench/check-*.log
            .workbench/context-*.json
            .workbench/runs/**/receipt.json
            .workbench/runs/**/stdout.txt
            .workbench/runs/**/stderr.txt
            .workbench/source.bundle
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
